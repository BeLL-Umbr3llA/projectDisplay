<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Detail | TU Monywa</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="detail-view">

    <nav class="top-nav">
        <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> ရှေ့စာမျက်နှာသို့ပြန်ရန်</a>
    </nav>

    <div class="detail-container">
        <div class="major-badge-wrapper">
            <div class="major-badge" id="p-major">MAJOR</div>
        </div>

        <header class="detail-header">
            <h1 id="p-title">Project Title</h1>
        </header>
        <div class="project-image-container">
        
        <div class="detail-grid">

            <section class="detail-card">
                <div class="project-image-preview">
                <img id="p-img" src="" alt="Project Preview">

            </section>
            <section class="detail-card">
                <h3><i class="fas fa-info-circle"></i> နိဒါန်း (Introduction)</h3>
                <p id="p-intro"></p>
            </section>

            <section class="detail-card">
                <h3><i class="fas fa-bullseye"></i> ရည်ရွယ်ချက် (Aim and Objectives)</h3>
                <p id="p-aim" style="white-space: pre-line;"></p>
            </section>

            <section class="detail-card">
                <h3><i class="fas fa-book"></i> သီအိုရီ (Theory)</h3>
                <p id="p-theory"></p>
            </section>

            <section class="detail-card">
                <h3><i class="fas fa-microchip"></i> လုပ်ဆောင်ပုံအဆင့်ဆင့် (System Process)</h3>
                <ul id="p-process" class="process-list"></ul>
            </section>
            <section class="detail-card">
                <h3><i class="fas fa-microchip"></i>  နိဂုံး (Conclusion)</h3>
                <ul id="p-con" ></ul>
            </section>
        </div>

        <footer class="conclusion-box">
            
            <h3><i class=""></i> NextGen Engineers - Mg Blah Blah ( IEC - 1)</h3>
            <h3><i class=""></i> Empowering Tomorrow through Engineering Excellence</h3>
            <p id="p-con"></p>
        </footer>
    </div>

    <script src="script.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        loadProjectDetails(params.get('id'));
    </script>
</body>
</html>
